[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonoform"
dynamic = ["version"]
description = "Chladni plates solved from the equations of elasticity, bowed in the browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sameh Aissa" }]
keywords = ["chladni", "plate-vibration", "eigenvalues", "finite-element", "acoustics", "kirchhoff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-fem>=9.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
sonoform = "sonoform.cli:main"

[project.urls]
Homepage = "https://github.com/samehaisaa/sonoform"
Issues = "https://github.com/samehaisaa/sonoform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sonoform"]

[tool.hatch.build.targets.sdist]
# The two wav files are 450 KB and nothing needs them to build from source.
# The README figures stay in, so the archive still renders on its own.
exclude = ["docs/*.wav", ".github", "*.npy"]

[tool.hatch.version]
path = "src/sonoform/__init__.py"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full inverse solves, minutes rather than seconds"]
