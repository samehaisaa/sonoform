name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # the slow suite, nightly, so drift shows up without waiting for a push
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The page's JavaScript is tested against the package from pytest,
      # so the Node it runs on is pinned here rather than left to the image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -m "not slow"

  slow:
    # Minutes rather than seconds: the inverse solves and the preset frequency
    # pins. Kept off pull requests so review stays quick.
    name: slow suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "slow"
