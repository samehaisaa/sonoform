name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/image.yml
      - pyproject.toml
      - src/**

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build and get smoke tested, but nothing is published
      # from a branch that has not merged.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sonoform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --rm --name sonoform -p 8731:8731 sonoform:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8731/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8731/ || { docker logs sonoform; exit 1; }
          curl -fsS -X POST http://127.0.0.1:8731/plate -o plate.json \
            -H 'Content-Type: application/json' \
            -d '{"shape":"square","modes":6}'
          python tools/smoke_check.py
          docker stop sonoform

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
